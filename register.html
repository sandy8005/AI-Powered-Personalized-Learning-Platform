{% extends 'base.html' %}

{% block content %}
  <div class="max-w-md mx-auto mt-10 bg-white p-6 shadow rounded">
    <h2 class="text-2xl font-semibold mb-4 text-center">Register</h2>
    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label for="email" class="block text-gray-700">Email</label>
        <input type="email" name="email" id="email"
               class="mt-1 block w-full border border-gray-300 rounded p-2"
               placeholder="example@domain.com" required>
      </div>

      <div class="mb-4">
        <label for="password" class="block text-gray-700">Password</label>
        <input type="password" name="password" id="password"
               class="mt-1 block w-full border border-gray-300 rounded p-2"
               placeholder="********" required>
      </div>

      <div class="mb-4">
        <label for="full_name" class="block text-gray-700">Full Name</label>
        <input type="text" name="full_name" id="full_name"
               class="mt-1 block w-full border border-gray-300 rounded p-2"
               placeholder="John Doe" required>
      </div>

      <div class="mb-4">
        <label for="dob" class="block text-gray-700">Date of Birth</label>
        <input type="date" name="dob" id="dob"
               class="mt-1 block w-full border border-gray-300 rounded p-2"
               required>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
        Register
      </button>
    </form>

    {% if error %}
      <div class="mt-4 p-2 bg-red-200 text-red-800 rounded">
        {{ error }}
      </div>
    {% endif %}
  </div>
{% endblock %}
