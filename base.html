<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Learning Platform</title>
  <!-- Include Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Optionally, add your custom Tailwind configuration here -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1D4ED8',
          },
        },
      },
    }
  </script>
</head>
<body class="bg-gray-50">
  <header class="bg-white shadow">
    <div class="container mx-auto px-4 py-6">
      <h1 class="text-2xl font-bold text-gray-800">AI Learning Platform</h1>
    </div>
  </header>
  
  <nav class="bg-gray-100">
    <div class="container mx-auto px-4 py-3 flex space-x-4">
      <a href="{% url 'home' %}" class="text-gray-700 hover:text-primary">Home</a>
      <a href="{% url 'about' %}" class="text-gray-700 hover:text-primary">About</a>

      {% if request.session.user_id %}
        <!-- Show Logout if the user is logged in -->
        <a href="{% url 'logout' %}" class="text-gray-700 hover:text-primary">Logout</a>
      {% else %}
        <!-- If not logged in, show Login and Register links -->
        <a href="{% url 'login' %}" class="text-gray-700 hover:text-primary">Login</a>
        <a href="{% url 'register' %}" class="text-gray-700 hover:text-primary">Register</a>
      {% endif %}
    </div>
  </nav>

  <main class="container mx-auto px-4 py-8">
    {% block content %}
    {% endblock %}
  </main>

  <footer class="bg-white border-t mt-8">
    <div class="container mx-auto px-4 py-4 text-center text-gray-600">
      &copy; 2025 AI Learning Platform
    </div>
  </footer>
</body>
</html>
