
{% extends 'base.html' %}

{% block content %}
  <div class="max-w-md mx-auto bg-white p-8 shadow rounded">
    <h2 class="text-xl font-semibold mb-4">Login</h2>
    {% if error %}
      <div class="mb-4 p-2 bg-red-200 text-red-800 rounded">
        {{ error }}
      </div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="space-y-4">
        <div>
          <label for="email" class="block text-gray-700">Email:</label>
          <input type="email" name="email" id="email" class="mt-1 block w-full border border-gray-300 rounded p-2" required>
        </div>
        <div>
          <label for="password" class="block text-gray-700">Password:</label>
          <input type="password" name="password" id="password" class="mt-1 block w-full border border-gray-300 rounded p-2" required>
        </div>
      </div>
      <button type="submit" class="w-full mt-4 bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
        Login
      </button>
    </form>
  </div>
{% endblock %}
