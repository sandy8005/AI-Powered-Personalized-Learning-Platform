{% extends 'base.html' %}

{% block content %}
  <div class="max-w-2xl mx-auto bg-white p-6 shadow rounded mt-8">
    <h2 class="text-2xl font-semibold mb-4 text-gray-800">Create New Course Plan</h2>
    
    <form method="post" action="{% url 'create-course-plan-form' %}">
      {% csrf_token %}
      
      <input type="hidden" name="user_id" value="{{ request.session.user_id }}">
      
      <div class="mb-4">
        <label for="course_plan_name" class="block text-gray-700 font-medium mb-2">Course Name</label>
        <input 
          type="text" 
          name="course_plan_name" 
          id="course_plan_name"
          class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" 
          placeholder="e.g., Introduction to Machine Learning"
          required
        >
      </div>
      
      <div class="mb-4">
        <label for="learning_goal" class="block text-gray-700 font-medium mb-2">Learning Goal</label>
        <textarea 
          name="learning_goal" 
          id="learning_goal"
          rows="3"
          class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" 
          placeholder="What you want to learn from this course..."
          required
        ></textarea>
      </div>
      
      <div class="mb-4">
        <label for="course_type" class="block text-gray-700 font-medium mb-2">Course Type</label>
        <select 
          name="course_type" 
          id="course_type"
          class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        >
          <option value="course">Course Only</option>
          <option value="course_assignment">Course with Assignments</option>
          <option value="course_assignment_project">Course with Assignments and Project</option>
        </select>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label for="start_date" class="block text-gray-700 font-medium mb-2">Start Date</label>
          <input 
            type="date" 
            name="start_date" 
            id="start_date"
            class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
        </div>
        
        <div>
          <label for="end_date" class="block text-gray-700 font-medium mb-2">End Date</label>
          <input 
            type="date" 
            name="end_date" 
            id="end_date"
            class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
        </div>
      </div>
      
      <button 
        type="submit" 
        class="w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700 transition duration-200"
      >
        Generate Course Plan
      </button>
    </form>
    
    {% if error %}
      <div class="mt-4 p-2 bg-red-200 text-red-800 rounded">
        {{ error }}
      </div>
    {% endif %}
  </div>
{% endblock %}
